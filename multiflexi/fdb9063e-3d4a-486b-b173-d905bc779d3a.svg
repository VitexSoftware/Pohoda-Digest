<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="18" y="30" width="64" height="52" rx="6" fill="#fff" opacity=".95"/>
  <!-- Calendar header -->
  <rect x="18" y="30" width="64" height="16" rx="6" fill="#6a1b9a"/>
  <rect x="18" y="40" width="64" height="6" fill="#6a1b9a"/>
  <!-- Calendar rings -->
  <rect x="32" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <rect x="64" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <!-- Number 365 -->
  <text x="50" y="68" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1a237e" text-anchor="middle">365</text>
  <!-- Trend line -->
  <polyline points="24,78 36,74 48,70 60,66 72,58" fill="none" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="58" r="3" fill="#6a1b9a"/>
</svg>

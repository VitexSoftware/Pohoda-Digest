<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="18" y="30" width="64" height="52" rx="6" fill="#fff" opacity=".95"/>
  <!-- Calendar header -->
  <rect x="18" y="30" width="64" height="16" rx="6" fill="#ff8f00"/>
  <rect x="18" y="40" width="64" height="6" fill="#ff8f00"/>
  <!-- Calendar rings -->
  <rect x="32" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <rect x="64" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <!-- Number 7 -->
  <text x="50" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1a237e" text-anchor="middle">7</text>
  <!-- Week dots (7 days) -->
  <circle cx="24" cy="20" r="3" fill="#fff" opacity=".9"/>
  <circle cx="32" cy="20" r="3" fill="#fff" opacity=".9"/>
  <circle cx="40" cy="20" r="3" fill="#fff" opacity=".9"/>
  <circle cx="48" cy="20" r="3" fill="#fff" opacity=".9"/>
  <circle cx="56" cy="20" r="3" fill="#fff" opacity=".9"/>
  <circle cx="64" cy="20" r="3" fill="#fff" opacity=".6"/>
  <circle cx="72" cy="20" r="3" fill="#fff" opacity=".6"/>
</svg>

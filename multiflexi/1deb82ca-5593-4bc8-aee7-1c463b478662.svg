<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="18" y="30" width="64" height="52" rx="6" fill="#fff" opacity=".95"/>
  <!-- Calendar header -->
  <rect x="18" y="30" width="64" height="16" rx="6" fill="#00838f"/>
  <rect x="18" y="40" width="64" height="6" fill="#00838f"/>
  <!-- Calendar rings -->
  <rect x="32" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <rect x="64" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <!-- Infinity symbol -->
  <text x="50" y="68" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#1a237e" text-anchor="middle">∞</text>
  <!-- Stacked bars bottom -->
  <rect x="24" y="72" width="12" height="6" rx="1" fill="#00838f" opacity=".5"/>
  <rect x="40" y="72" width="12" height="6" rx="1" fill="#00838f" opacity=".7"/>
  <rect x="56" y="72" width="12" height="6" rx="1" fill="#00838f" opacity=".9"/>
  <rect x="72" y="72" width="8" height="6" rx="1" fill="#00838f"/>
</svg>

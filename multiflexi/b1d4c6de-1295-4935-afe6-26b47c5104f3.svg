<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="18" y="30" width="64" height="52" rx="6" fill="#fff" opacity=".95"/>
  <!-- Calendar header -->
  <rect x="18" y="30" width="64" height="16" rx="6" fill="#e53935"/>
  <rect x="18" y="40" width="64" height="6" fill="#e53935"/>
  <!-- Calendar rings -->
  <rect x="32" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <rect x="64" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <!-- Day number -->
  <text x="50" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1a237e" text-anchor="middle">1</text>
  <!-- Sun icon -->
  <circle cx="78" cy="20" r="8" fill="#ffd600"/>
  <g stroke="#ffd600" stroke-width="2" stroke-linecap="round">
    <line x1="78" y1="8" x2="78" y2="11"/>
    <line x1="78" y1="29" x2="78" y2="32"/>
    <line x1="66" y1="20" x2="69" y2="20"/>
    <line x1="87" y1="20" x2="90" y2="20"/>
  </g>
</svg>

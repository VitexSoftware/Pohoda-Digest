<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="18" y="30" width="64" height="52" rx="6" fill="#fff" opacity=".95"/>
  <!-- Calendar header -->
  <rect x="18" y="30" width="64" height="16" rx="6" fill="#43a047"/>
  <rect x="18" y="40" width="64" height="6" fill="#43a047"/>
  <!-- Calendar rings -->
  <rect x="32" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <rect x="64" y="24" width="4" height="14" rx="2" fill="#fff"/>
  <!-- Number 30 -->
  <text x="42" y="72" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1a237e" text-anchor="middle">30</text>
  <!-- Mini bar chart -->
  <rect x="62" y="66" width="5" height="10" rx="1" fill="#43a047"/>
  <rect x="69" y="60" width="5" height="16" rx="1" fill="#2e7d32"/>
  <rect x="76" y="54" width="5" height="22" rx="1" fill="#1b5e20"/>
</svg>
